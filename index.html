<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b100d"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MWINDA"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>MWINDA</title>
<style>
:root{--bg:#0b100d;--bg2:#12331f;--ink:#f2f7f3;--mut:#a9bfb0;--gold:#6fd08c;--card:rgba(255,255,255,.08);--paper:#fbf6ea;--pi:#2b2417;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,var(--bg2),var(--bg) 60%);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:12px;color:var(--mut);position:sticky;top:0;background:rgba(11,16,13,.88);backdrop-filter:blur(6px);z-index:5}
.top b{color:var(--ink)}
.logo{width:34px;height:34px;flex:none}
main{max-width:720px;margin:0 auto;padding:16px}
.screen{animation:in .6s ease both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
h1,h2{font-family:Georgia,serif;margin:.3em 0}
h1{font-size:34px}
.hero{text-align:center;padding:30px 0}
.hero .logo{width:84px;height:84px;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
input{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:var(--card);color:var(--ink);font-size:16px}
button{cursor:pointer;border:0;border-radius:30px;padding:14px 26px;font-size:16px;font-weight:600;background:linear-gradient(135deg,#0f7a3c,#12a550);color:#fff;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 20px rgba(18,165,80,.35)}
button:hover{transform:translateY(-2px)}
button.ghost{background:var(--card);color:var(--ink);box-shadow:none}
.card{background:var(--card);border-radius:18px;padding:20px;margin:14px 0;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.day{border-radius:16px;padding:12px 6px;text-align:center;background:var(--card);cursor:pointer;border:1px solid transparent;transition:.25s;position:relative}
.day:hover{border-color:var(--gold);transform:scale(1.04)}
.day small{display:block;color:var(--mut);font-size:11px}
.day.done{background:linear-gradient(135deg,#2e7d5b,#4fb286)}
.day.lock{opacity:.4;cursor:not-allowed}
.bar{height:8px;border-radius:8px;background:var(--card);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--gold);transition:width .8s}
.ill{height:170px;border-radius:18px;overflow:hidden;margin:12px 0}
.ill svg{width:100%;height:100%;display:block}
textarea{width:100%;min-height:110px;border-radius:14px;padding:12px;background:var(--card);border:1px solid rgba(255,255,255,.2);color:var(--ink);font:inherit}
.book{perspective:1400px;margin:14px 0}
.page{max-height:none;word-wrap:break-word;background:var(--paper);color:var(--pi);font-family:Georgia,serif;border-radius:6px 14px 14px 6px;padding:26px 24px;line-height:1.75;min-height:300px;box-shadow:inset 8px 0 14px -8px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);transform-origin:left center;font-size:16px}
.page.out{animation:flipo .5s ease-in forwards}.page.inn{animation:flipi .5s ease-out both}
@keyframes flipo{to{transform:rotateY(-90deg);opacity:.2}}
@keyframes flipi{from{transform:rotateY(90deg);opacity:.2}}
.pn{text-align:center;font-size:13px;color:#8a7a55;margin-top:10px}
.row{display:flex;gap:10px;justify-content:space-between;margin:14px 0;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal div{background:var(--bg2);border-radius:22px;padding:30px;text-align:center;max-width:360px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.cf{position:fixed;top:-20px;font-size:26px;animation:fall linear forwards;z-index:30;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pp{display:inline-block;animation:dance 1s ease-in-out infinite}
@keyframes dance{50%{transform:translateY(-18px) rotate(8deg)}}
h1,h2,.brand{font-family:Oswald,'Arial Narrow',Impact,sans-serif;text-transform:uppercase;color:var(--gold);letter-spacing:.5px}
.brand{font-size:56px;line-height:1;margin:14px 0 0}.brand small{display:block;font-size:.38em;color:var(--ink);letter-spacing:.12em}
.hero .logo{width:110px;height:110px}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(circle at 15% 20%,#2e86de55,transparent 35%),radial-gradient(circle at 80% 30%,#e8a31744,transparent 30%),radial-gradient(circle at 70% 85%,#d6454144,transparent 32%),radial-gradient(circle at 25% 80%,#12a55055,transparent 35%);filter:blur(30px);animation:dr 18s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(4%,3%) scale(1.1)}}
.page small{font-size:12px;color:#6b5f44}
</style></head><body>
<div class="top" id="top" hidden></div>
<main id="app"></main>

const BOOK={"16": {"t": "Chapitre 1 · Affranchissement de vos prisons", "p": ["Chapitre Un AFFRANCHISSEMENT DE VOS PRISONS C'est la volonté absolue de Dieu que chaque individu soit affranchi de toute prison ou lien qui entrave ou contraint.<br><br>Jean 8 déclare explicitement la volonté de Dieu.<br><br>Jean 8:31,32 et 36:<br><br>Si vous demeurez dans ma parole, vous êtes vraiment mes disciples; vous connaîtrez la vérité, et la vérité vous affranchira.<br><br>Si donc le Fils vous affranchit, vous serez réellement libres.<br><br>Ces trois courts versets contiennent la clé de l'affranchissement: nous devons croire la Parole de Dieu qui est Vérité puis nous devons connaître le Fils qui est la Voie, la Vérité et la Vie. En suivant la Parole de Dieu et en connaissant Son fils, nous ne serons pas seulement libres mais réellement libres.<br><br>La volonté de Dieu est que chacun de nous soit affranchi aujourd'hui de quelque prison que ce soit qui nous retient.<br><br>Les prisons ne sont pas uniquement faites de barres d'acier. Les prisons de nos péchés secrets, les choses de notre vie que nous ne voulons partager avec aucune autre personne au monde, sont les plus", "frustrantes et les plus contrariantes.<br><br>L'auto-condamnation qui nous rongeait, consciemment ou inconsciemment, depuis des années--les idées de maladie et de maux, de frayeur, d'inquiétude, d'anxiété, de suicide, de mort--sont les plus torturantes et pires prisons. Il n'est pas de la volonté de Dieu que nous soyons ainsi mentalement restreints; la volonté de Dieu est tout le contraire car Il a donné l'affranchissement complet de tout ce qui est négatif.<br><br>Psaumes 103:11,12:<br><br>Mais autant les cieux sont élevés au-dessus de la terre, Autant sa bonté est grande pour ceux qui le craignent; Autant l'orient est éloigné de l'occident, Autant il éloigne de nous nos transgressions.<br><br>C'est la volonté de Dieu que toute auto-condamnation disparaisse parce qu'Il veut nous rendre réellement libres--non pas des individus demi-libres, mais entièrement libres.<br><br>Non seulement Dieu veut-Il nous affranchir de toute condamnation secrète, mais Il veut que nous soyons affranchis de toutes les puissances des ténèbres dans ce monde. Il désire que nous soyons affranchis du ressentiment, de l'orgueil, de l'envie, des jalousies, des obsessions et des oppressions qui nous rongeaient.<br><br>Il veut que nous soyons affranchis de ces", "prisons également.<br><br>L'humanité a vécu au sein du mal depuis que le Diable a reçu la puissance de ce monde.<br><br>L'homme s'est attiré les maux qui l'entourent.<br><br>Mais Dieu, dans Son grand amour, a fourni un moyen par lequel les hommes puissent reconnaître et recevoir une puissance plus grande et plus merveilleuse que toute autre qu'ils aient connue, afin que ceux qui veulent croire puissent être affranchis de toute prison asservissant leurs vies.<br><br>En Matthieu 15:13 Jésus dit: \" . Tou- ce plante que racines plantée mel Pace Toute influence qui n'est pas fondée sur l'exactitude de la Parole de Dieu n'aboutira à rien. De telles influences ne mènent qu'à l'emprisonnement.<br><br>Hebreux 4:2:<br><br>Car cette bonne nouvelle nous a été annoncée aussi bien qu'à eux; mais la parole qui leur fut annoncée ne leur servit de rien, parce qu'elle ne trouva pas de la foi ‹ croyance> chez ceux qui l'entendirent.<br><br>Nous ne devons pas seulement entendre que le Christ nous a affranchis, nous devons croire et vivre en conséquence.<br><br>Un appareil photographique offre une *Luc 4:6: \"Et ‹le Diable > lui dit: Je te donnerai toute cette puissance, et la gloire de ces royaumes; car elle m'a été donnée, et je la donne à qui je veux.\"", "analogie appropriée des moyens par lesquels vos prières peuvent être exaucées et vous pouvez être affranchi de vos prisons.<br><br>Si vous voulez une réponse à vos prières, fixez d'abord votre objectif dans votre esprit. Vous choisissez ce que vous voulez Ceci est la première dans votre photo. étape: vous savez précisément ce que vous voulez. Deuxièmement, vous utilisez le télémètre et mettez bien votre sujet au point. Puis vous considérez la durée d'exposition de la photo afin que tous les facteurs travaillent de concert pour vous assurer une photo parfaite.<br><br>Après tout ceci, vous tirez la photo.<br><br>Lorsque vous avez fait la mise au point sur l'image de ce que vous voulez, gardez votre esprit fixé sur cette image.<br><br>Si vous permettez à autre chose d'intervenir et de supplanter cette image, vous obtiendrez une réponse floue à vos prières; vous n'obtiendrez pas les résultats que vous désirez; vous ne serez pas affranchi de la prison qui vous enferme.* Si vous voulez vous débarrasser de quelque chose aujourd'hui, vous devez vous concentrer, vous attarder sur ce que vous voulez. C'est l'introduction de lumière qui dissipe les ténèbres, non pas l'at-tardement sur les ténèbres qui introduit la lumière. Si vous désirez faire de *Jacques 1:6,7: \"Mais qu'il la demande avec foi, sans douter; car celui qui doute est semblable au flot de la mer, agité par le vent et poussé de côté et d'autre. Qu'un tel homme ne s'imagine pas qu'il recevra"], "n": [5, 6, 7, 8]}, "17": {"t": "Chapitre 1 · Affranchissement de vos prisons", "p": ["meilleures affaires, établir de meilleures relations entre employeur et employé ou obtenir une meilleure situation, pensez à votre désir, faites-en la mise au point dans votre esprit puis déterminez le temps d'exposition requis pour accomplir la tâche.<br><br>Si vous voulez vous affranchir de vos prisons aujourd'hui, changez immédiatement votre façon de penser quant à votre situation; changez l’objet de votre mise au point.<br><br>En changeant votre façon de penser vous etare ce mental dans votre vie et en retour ceci dissip-pera et déracinera les choses que vous ne voulez pas.<br><br>Vous direz peut-être, \"Ce n'est pas une chose facile à faire, mais je vais essayer. Avec l'aide de Dieu selon Sa Parole, je vais m'affranchir de cette prison.\"<br><br>Cependant, si en moins d'une demie-heure vous avez oublié de garder votre façon de penser changée et que vous retombez dans vos vieilles habitudes négatives, vous vous retrouverez au même point où vous étiez auparavant. Ne vous demandez pas alors pourquoi vous ne pouvez obtenir une réponse à vos prières, pourquoi vous êtes incapable de capter ces ressources, pourquoi la réponse ne vous vient pas aussi facilement qu'à d'autres, pourquoi vous ne pouvez vous affranchir. La réponse est que vous n'avez changé votre image mentale que momentanément; vous n'avez pas gardé votre image au point et ne lui avez pas accordé le temps d'exposition approprié.<br><br>L'affranchissement de vos prisons", "dépend de deux choses: la préoccupation--les deux \"p's\" de l'affranchissement. Déterminez avec précision ce que vous voulez, puis préoccupez-vous de le recevoir. Fixez bien dans votre esprit et dans votre coeur la Parole de Dieu de délivrance et d'affranchissement; mangez-la, buvez-la, dormez et marchez avec elle. Chaque fois que vous faites un pas ou chaque fois que vous pensez à votre situation ou à votre état, remerciez Dieu du fait que la réponse et votre affranchissement se préparent. Bientôt, les choses négatives disparaissent et les choses positives deviennent vôtres, vous libérant ainsi de toute prison dans laquelle vous vous trouvez. Ce peut être fait; ce sera fait car comme le dit Phi-a ports 4e13, \"Je puis tout par celui qui Quelle image vous êtes-vous faite de vous-même au cours de la dernière semaine, du dernier mois, de la dernière année, des derniers dix ans? L'image que vous vous faites de vous-même avec précision et préoccupation est ce que vous êtes.<br><br>La loi s'applique de la même façon aux pensées positives et négatives.<br><br>La plupart des gens croient qu'afin d'atteindre les sommets spirituels de vie où ils peuvent capter les ressources de Dieu, il est nécessaire de faire de gros efforts et de lutter. Ils croient qu l'obtention de résultats spirituels opère selon le même principe qu'un marteau pneumatique-- plus on appuie sur le marteau, plus vite le travail s'accomplit. Toutefois, tel n'est pas le cas.<br><br>Lorsque nous", "sommes soumis aux gros efforts et à la lutte, nous devenons à bout de nerfs.<br><br>Nous ne nous affranchirons jamais de nos prisons de cette façon; bien au contraire --nous frustrons de plus en plus nos propres efforts. Ce ne sont pas les efforts fait de croire et d'agir selon la Parois.<br><br>Jacques 1:21:<br><br>C'est pourquoi, rejetant toute souillure et tout excès de malice, recevez avec douceur la parole qui a été plantée en vous, et qui peut sauver vos âmes .<br><br>\"Rejeter\" veut dire \"éloigner\". Nous devons eloigner toute souillure, les moindres comme les pires oeuvres du mal, et recevoir subjectivement la Parole de Dieu, en ce sens que nous comptons sur elle et la désirons parce que Sa Parole est plus grande que nous ne le sommes. \"La parole qui a été plantée en vous\"' est l'ensemble de la Parole de Dieu qui a été plantée en nous, qu'Il a plantée si près de nous que nous pouvons l'absorber jusqu'à ce qu'elle fasse partie de nous-mêmes.<br><br>Peu importe qui vous êtes ou dans quelle prison vous vous trouvez, Dieu entendra votre prière.<br><br>Changez-vous en changeant votre façon de penser et alors les circonstances changeront.<br><br>Etudiez la Parole de Dieu et vous apprendrez à connaître le Christ qui vous a affranchi.<br><br>\"Si donc le Fils vous affranchit, vous serez réellement libres.\" En dehors du", "Christ nous ne pouvons être libres. Jésus-Christ fut le libérateur qui nous a affranchis. Il est le chef de l'Eglise.<br><br>La vérité de la Parole et du Christ est notre lumière et notre puissance dans la vie; ceci est notre affranchissement des craintes, inquiétudes, anxiétés, déceptions, chagrins, ennuis et tout le reste qui survient. Ceci est notre moyen de sortir des prisons négatives de l'auto-esclavage vers la glorieuse liberté des enfants de Dieu.<br><br>Lorsque vous vous trouvez dans une des prisons de la vie, fixez dans votre esprit une image positive, précise, de votre moi libéré.<br><br>Faites la mise au point sur cette image positive et remerciez Dieu que des maintenant vous ayez la réponse.<br><br>Continuez à confesser et à croire positivement selon la Parole, et votre affranchissement s'ensuivra incontestablement."], "n": [9, 10, 11, 12]}, "18": {"t": "Chapitre 2 · Comment éviter d'être un raté", "p": ["Chapitre Deux COMMENT EVITER D'ETRE UN RATE La simplicité de la Parole de Dieu, la Bible, est renversante. La plupart d'entre nous sommes imbus de trop de théologie compliquée et de trop peu de croyance simple. Nous sommes enfermés par tant de choses négatives que même les choses positives sont ensevelies dans les ténèbres. Nous rendons Dieu trop difficile.<br><br>Personne ne veut être un raté. Dieu ne veut pas de ratés--alors, pourquoi en être? Il n'est pas nécessaire que vous en soyez, si vous ne le voulez pas. Ceci est la signification exacte de cette étude.<br><br>Souvenez-vous de l'histoire de la femme qui avait perdu une de ses dix drachmes ? Elle la chercha avec soin jusqu’à ce qu’elle la retrouve. Et lorsqu’elle l’eut retrouvée, elle appela toutes les voisines et fit une fête parce qu'ayant perdu une petite drachme, ne valant que quelques sous, elle l'avait enfin retrouvée. Et toutes les voisines se réjouirent avec elle. Pouvez-vous imaginer qu'un petit village dans votre coin de pays se réjouisse pour quelques sous retrouvés-- sans parler d'en faire une fête!<br><br>Comment cette femme a-t-elle évité d'être ratée?<br><br>Luc 15:8-10: du quelle et tien per de une, n'allume une lampe, ne", "balaie la maison, et ne cherche avec soin, jusqu'à ce qu'elle la retrouve?<br><br>Lorsqu'elle l'a retrouvée, elle appelle ses amies et ses voisines, et dit: Réjouissez-vous avec moi, car j'ai retrouvé la drachme que j'avais perdue.<br><br>De même, je vous le dis, il y a de la joie devant les anges de Dieu pour un seul pécheur qui se repent.<br><br>Il y a trois histoires intéressantes dans le quinzième chapitre de Luc et toutes trois traitent du même sujet principal. La première a trait au berger qui possédait cent brebis dont quatre-vingt- dix-neuf seulement étaient en sûreté. La troisième histoire est celle que la plupart des gens appellent, à tort, \"l'histoire du fils prodigue\". Ce serait plus à propos de l'appeler \"l'histoire du père indulgent\". La seconde est l'histoire appelec d'une femme qui a évité d'être une ratée parce qu'elle a trouvé une petite drachme:<br><br>Vous pouvez rire, mais c'est vrai--son mari l'aurait chassée de la maison si elle n'avait pas retrouvé la drachme perdue. Ainsi, aux yeux de toute la ville, hommes et femmes, elle aurait été une ratée.<br><br>Les drachmes ne sont pas simplement dix pièces de monnaie ordinaires ou de peu d'importance; elles sont le don le plus précieux que l'épouse reçoit de son époux lors de leur mariage.", "Chaque drachme a environ la taille d'une pièce d'un franc. Sur une face de la drachme est gravée l'insigne par laquelle cette famille particulière est connue.<br><br>Si l'emblème de la famille se trouve être une brebie, bien nourrie, protégée et en sécurité, cette image est gravée sur l'une des faces de chacune des dix drachmes.<br><br>Sur l'autre face est gravée l'année où la drachme a été frappée.<br><br>Le mari donne cette dot spéciale à sa femme pendant leurs fiançailles. La valeur monétaire de ces drachmes est faible, mais leur valeur sentimentale est inestimable.<br><br>Aucune somme d'argent ne saurait remplacer la drachme perdue.<br><br>Maintenant, tout comme au temps de Jésus, les femmes orientales reçoivent, au moment de leur mariage, de somptueux bijoux. Tous les bijoux qu'une femme reçoit deviennent sa propriété et lui appartiennent en propre, à l'exception des dix drachmes. Elle a tous les droits légaux à tous ses bijoux; le mari n'en a aucun. Il ne peut en aucun cas lui enlever es bijoux, avec une seule exception--le bijou appelé \"les dix drachmes\". Ce bijou, advenant le décès du mari, doit immédiatement être remís à la famille du mari.<br><br>Le bijou appelé \"les dix drachmes\" n'est porté par l'épouse qu'en des occasions très spéciales.<br><br>A cause de son amour pour son mari, il se peut qu'elle les porte pendant que son mari est au travail et qu'elle se contemple dans une glace, appréciant le cadeau et l'amour de son mari.<br><br>Néanmoins, parce qu'elles lui sont si précieuses, elle les porte rarement de"], "n": [13, 14, 15]}, "19": {"t": "Chapitre 2 · Comment éviter d'être un raté", "p": ["crainte d'en perdre une. Un vingt-cinquième ou cinquantième anniversaire de mariage justifierait de les porter. Rien de moins que les occasions les plus spéciales.<br><br>Lorsque l'épouse porte les dix drachmes , elle porte cinq pièces d'un côté de la tête, vers l'avant de la tête, et les cinq autres pièces de l'autre côté de sa tête. Chaque drachme est munie d'un petit crochet au sommet. Avec ces crochets l'épouse attache les drachmes dans ses cheveux. Ainsi, vous pouvez comprendre combien facilement une ou plusieurs de ces pièces pourraient se détacher et comment elle pourrait les perdre sans s'en rendre compte. sera shelle perd ume den pracons épeuxe Le mari ne la divorcera pas ni ne sera en colère de ce fait, mais il chassera simplement l'épouse pour l'avoir déshonoré ainsi que sa maison et pour avoir attiré la honte sur sa famille. Le mari se défait de son épouse non pas à cause de la valeur monétaire des dix drachmes, mais parce que la perte d'une des drachmes signifie le retrait de la faveur de Dieu pour la famille. La perte d'une drachme toute la est considérée comme une malédiction sur famille. Ni le mari, ni ses parents n'ont de malveillance pour elle; mais l'épouse ne recevra aucune sympathie de son mari, des parents de ce dernier ni d'aucun autre membre de sa belle-famille Même si la famille de l'épouse donnait un million au mari, ceci n'arrangerait rien. Lorsque l’épouse perd une drachme, toute la ville s'inquiète pour elle car", "ils connaissent les conséquences qui sont le déshonneur et l'expulsion. Toutes les femmes de la ville savent ce qu'elle doit supporter. Donc, lorsque la femme retrouve la drachme perdue et sait qu'elle est en sécurité, elle invite ses voisines à se réjouir avec elle du fait qu'elle ait retrouvé la drachme. Elle a évité de devenir une ratée.<br><br>Nous aussi pouvons éviter de devenir des ratés en donnant priorité aux choses primordiales.<br><br>Matthieu 6:33:<br><br>Cherchez premièrement le royaume et la justice de Dieu; et toutes ces choses vous seront données pardessus.<br><br>Cherchez d'abord toute autre chose et toutes les choses vous seront retirées.<br><br>Nous sommes la création la plus précieuse de Dieu. Il ne veut pas de ratés et Il ne fait pas de ratés. Sa volonté pour nous est le succès en tout.<br><br>La première marche de cette échelle du succès pour un pécheur est de se repentir. Le repentir est pour les pécheurs non-sauvés; la confession est pour le pe-cheur sauvé. L'amour de Dieu, le coeur du Père, languit tellement pour celui qui est perdu que l'Eglise se dépensera sans réserve, ne négligeant rien pour retrouver Le seul bijou précieux perdu. Qui est ce \"bijou\"? Chacun de nous l'est si nous ne L'avons pas accepté.<br><br>Vous dites \"Que dois-je faire?\" Le Père dit, \"Repentez-vous\". Comment vous", "repentir? Le repentir consiste à faire la volonté de Dieu. Il ne consiste pas à pleurer à chaudes larmes, à chanter des hymnes ni à courir à un autel. Toutes ces choses peuvent ou non entrer en ligne de compte, cependant elles ne sont pas du repentir. Le repentir est de faire ce que Dieu dit; et Il dit en Romains 10:9: \"Si tu confesses de ta bouche le Seigneur Jésus, et si tu crois dans ton coeur que Dieu l'a ressuscité des morts, tu seras sauvé.\" Le repentir de votre part consiste à confesser avec votre bouche le Seigneur Jésus comme votre seigneur et sauveur personnel.<br><br>C'est de croire dans votre coeur, du plus profond de votre être, que Dieu a ressuscité Jésus des morts, que Jésus est ressuscité et vivant, oui, vivant pour vous et en vous. Cela est le repentir. Il apporte la joie, non seulement aux anges du ciel, mais aussi au coeur du Père, car un bijou des plus précieux qui était perdu a été retrouvé; une vie de plus a évité d'être ratée.<br><br>Mais vous dites, \"Puis-je encore faire ceci? Puis-je m'élever au-delà de tout échec? Puis-je être certain?\" Oui, vous pouvez être aussi certain que Dieu Lui-même. Car Il est garant de Sa Parole; Il soutient Sa Parole; Il S'assure que Sa Parole s'accomplisse.<br><br>En Lui vous êtes complet. Vous êtes un fils de Dieu, un cohéritier du Christ-Jésus. Vous possédez des ressources illimitées. Avec Lui, vous ne pouvez faillit, vous ne pouvez que réussir.<br><br>Sans Lui, vous ne pouvez réussir, vous ne pouvez que faillir. Son invitation s'adresse à vous,", "car elle s'adresse à tous, \"Venez à moi... et je vous donnerai du repos.\" \"...Et voi-cí, je suis avec vous tous les jours...\" ...Je ne te délaisserai point, et je ne t'abandonnerai point.\" Venez!<br><br>Evitez d'être un raté! ***** Vous êtes seul maintenant à décider Si vous devez Le croire ou L'ignorer.<br><br>Vous devez prendre la décision, De L'accepter ou de refuser l'invitation.<br><br>Le prendre ou Le laisser, que ferez-vous, La croyance est votre assurance contre l'échec."], "n": [16, 17, 18, 19]}, "20": {"t": "Chapitre 3 · Limitez-vous Dieu ?", "p": ["Chapitre Trois LIMITEZ-VOUS DIEU?<br><br>Jésus-Christ est le nom le plus doux que je connaisse, car c'est en son nom, et en son nom seul, que je vois le potentiel illimité de l'homme. C'est au nom de Jésus-Christ que les hommes et les femmes sont sauvés, naissent de nouveau, sont convertis. C'est au nom de Jésus-Christ que les malades sont guéris pour se lever de nouveau et déclarer la gloire du Seigneur.<br><br>C'est au nom de Jésus-Christ que les esprits diaboliques sont chassés et que les gens sont libérés à tout jamais, en corps et en esprit. A moins que nous connaissions le nom de Jésus- Christ comme une réalité vivante essentielle dans nos vies, nous limitons indubitablement Dieu.<br><br>L'esprit de Dieu nait en nous du moment même où nous acceptons et croyons au Seigneur Jésus-Christ et que Dieu l'a ressuscité des morts. Ceci est un miracle surnaturel de Dieu puisque nous les croyants n'avons rien à voir à cette nouvelle naissance. Dieu est le faiseur de miracles.<br><br>C'est Lui qui crée un nouvel esprit en nous et fait de nous Ses enfants. Dès lors, nous sommes les enfants de Dieu, appartenons à la famille de Dieu, sommes des enfants de Dieu, des fils de Dieu, et cohéritiers du Christ-Jésus. Alors, nous ne sommes plus des serviteurs qui demeurent dans l'ignorance de leur Maître; mais nous sommes des fils, des fils de Dieu. Puisque nous sommes fils de Dieu, Satan n'a plus", "aucun droit légal sur nous, à moins que nous lui permettions d'usurper l'autorité qu'il ne possède plus de droit. Il se peut que nous limitions Dieu dans nos vies en ne sachant pas ce qui nous appartient légalement en tant que fils de Dieu par le Christ-Jésus Lorsque le Christ est mort sur le Calvaire, il était entièrement notre substitut, non seulement pour le péché mais aussi pour les conséquences du péché. Rien n'était négligé dans sa substitution pour nous. Lorsque nous commençons à reconnai-tre cette vérité et que nous acceptons l'oeuvre accomplie par le Christ comme réalité accomplie, nous devenons des hommes et des femmes remplis de l'esprit, impatients de manifester nos droits de filiation.<br><br>Lorsque cette merveilleuse transformation aura lieu et que nous ne limiterons pas Dieu, alors nous ne parlerons pas d'inquiétude, de crainte, d'anxiété, de maladie et de besoin. Nous oublions ces pensées négatives car nous sommes fils par Jésus-Christ qui les a surmontées.<br><br>Nous sommes des hommes et des femmes qui refusent de limiter la puissance de Dieu en nous, parce que nous désirons apporter à l'humanité la connaissance du Christ vivant. Lorsque nous cesserons de limiter Dieu, nous vivrons dans la Parole et la Parole vivra en nous.<br><br>II Corinthiens 9:8:<br><br>Et Dieu peut vous combler de toutes sortes de grâces, afin que, possédant toujours en toutes choses de quoi satisfaire à tous", "vos besoins, vous ayez encore en abondance pour toute bonne oeuvre Avons-nous limité Dieu dans nos vies?<br><br>Nous devons l'avoir fait si nous n'avons pas suffisamment de tout. La suffisance est la volonté de Dieu pour Ses enfants, afin que Ses enfants aient en abondance pour toute bonne oeuvre. Que nous ayons suffisamment est la volonté de Dieu pour nous; pourtant, combien de nous avons limité Dieu en ne Lui permettant pas de remplir cette promesse dans nos vies?<br><br>Combien lents nous avons été à nous rendre compte que c'est Dieu qui est notre capacité, que c'est Lui qui est la vie dans nos vies, que c'est Lui qui est la force de notre force, que c'est Lui qui est notre suffisance.<br><br>Nous limitons fréquemment Dieu en nous en croyant d'une manière erronée.<br><br>Notre raison nous dit, \"Nous ne pouvons pas avoir suffisamment de tout. Ce n'est pas possible.\"<br><br>Et ainsi, nous confessons une pensée négative, alors même que Son esprit en nous nous dit instamment \"Suffisance en tout\". Nous avons été si bien fornés à respecter les connaissances qui nous parviennent par l'entremise de nos cing sens que nous négligeons de reconnaître la connaissance qui nous vient du domaine supérieur, le spirituel, où la Parole de Dieu, non pas la raison, a préséance. Les deux domaines ou mondes résident ici: le monde naturel est factuel, réel; le monde spirituel est vrai.<br><br>Il y a quatre règnes ou royaumes dans", "ce monde, et chacun a la préséance sur l'autre: le règne végétal, le règne animal, le règne humain et le Royaume de Dieu Les trois premiers composent le monde naturel; le Royaume de Dieu est le monde surnaturel ou spirituel. Le monde naturel et tout ce qu'il contient viennent à l'intelligence par l'entremise ou au moyen des sens naturels. Les vérités du monde spirituel ne dépendent absolument pas des sens, mais plutôt de l'esprit de Dieu dans l'homme.<br><br>Nous ne pouvons rien connaître du monde spirituel au moyen des sens. C'est pourquoi Paul, par inspiration divine, a dit en I Corinthiens 2:14: \"Mais l'homme animal ‹ naturel› ne reçoit pas les choses de l'Esprit de Dieu, car elles sont une folie pour lui, et il ne peut les connai-tre, parce que c'est spirituellement qu'on en ‹les choses spirituelles › juge.\"<br><br>Les choses spirituelles du monde spirituel ne peuvent être connues en ce monde que par l'esprit de Dieu qui réside en nous. Alors, et seulement alors, l'Esprit peut-Il nous transmettre des vérités au sujet du monde spirituel et les faire connaître à nos sens. Alors, et seulement alors, avons- nous en nous cette capacité qui nous est donnée par Dieu de connaître des choses ayant trait au monde spirituel:<br><br>A maintes et maintes reprises, après que j'eus expliqué la différence entre les mondes naturel et spirituel et comment l'un a préséance sur l'autre et qu'il existe deux ensembles de lois, entièrement différents l'un de l'autre, des gens m'ont dit que par la suite ils furent en mesure"], "n": [21, 22, 23, 24]}, "21": {"t": "Chapitre 3 · Limitez-vous Dieu ?", "p": ["d'accorder à Dieu la place qu'Il mérite.<br><br>Alors, ils refusèrent de limiter Dieu en eux.<br><br>Peu de gens se rendent compte de la grande vérité spirituelle de la substitution du Christ et de la justice du croyant. Un homme en qui la nouvelle création vit est juste devant Dieu, selon la Parole de Dieu. L'homme né de nouveau est juste, et être juste veut dire que nous nous présentons devant Dieu dans la justice dont Il nous a revêtus par notre acceptation du Christ en tant que notre substitut pour le péché et les conséquences du péché.<br><br>Laissez-moi vous donner une définition de la justice qui vous aidera à briser les puissances des ténèbres dans et sur votre vie. La justice est la capacité qui vous est donnée par Dieu de vous présenter devant le Père sans un sentiment de péché, de culpabilité ou de condamnation.<br><br>Ceci veut dire qu'en tant qu'enfant de Dieu vous pouvez également vous trouver en présence de Satan même sans crainte et sans défaite parce que vous connaissez vos droits en Christ et que vous avez réclamé la suffisance qui vous est donnée par Dieu.<br><br>Lorsque nous reconnaissons que Dieu en Christ vit en nous, cette sorte de croyance nous rend victorieux de Satan en tous points. Nous arrivons alors au point où nous nous fions à la puissance ou à la capacité de Dieu en Christ en nous. Nous reconnaissons notre place dans la vie et nous travaillons en sachant que Dieu en Christ en nous nous est une garantie de succès. Nous allons à nos ateliers avec", "une confiance naturelle--dans nos foyers, dans nos commerces, sachant que Dieu en Christ en nous fait de nous des gagnants en toutes circonstances.<br><br>En soulignant l'abondance qui nous est donnée par Dieu, je veux que vous notiez Ephésiens 3:20. En fait, je veux que vous l'appreniez si bien qu'il devienne une réalité vivante en vous, de jour en jour, car alors vous saurez que la puissance de Dieu opère dans votre vie.<br><br>Ephésiens 3:20:<br><br>Or, à celui qui peut faire, par la puissance ‹ou capacité de Dieu> qui agit en nous, infiniment au- delà de tout ce que nous demandons ou pensons.<br><br>A quel point permettons-nous à Dieu de travailler en nous? C'est la question primordiale. Il ne s'agit pas ici du bon vouloir ou de la capacité de Dieu. Il s'agit simplement de permettre à la puissance illimitée de Dieu de vivre en nous et de produire en nous le vouloir et le faire selon Son bon plaisir. Il fera infiniment au-delà de tout ce que nous demandons ou pensons, mais uniquement dans la mesure où nous manifestons la puissance interne latente.<br><br>I Jean 4:4: ...vous êtes de Dieu... parce que celui qui est en vous est plus grand que celui qui est dans le monde.<br><br>Ainsi, je sais que la \"vie dans", "l'abondance\" dont il est question en Jean 10:10 est en moi. Il n'est plus avec moi pour me convaincre de mon péché et de mes défauts; mais Il est en moi pour me guider et me conduire dans toute la vérité et vers une abondance au-delà même de ce que je puis imaginer.<br><br>Je veux que Dieu soit en mesure de réaliser la plénitude de Son amour et de Sa suffisance dans votre vie. Mais Il ne peut outrepasser votre propre désir ou libre arbitre. Vous devez accepter, en croyant, les enseignements positifs de Sa Parole et chasser de votre esprit les pensées négatives de ce monde. Dieu a consigné par écrit Sa volonté d'abondance pour vous, mais ce n'est que lorsque vous croirez Sa Parole que vous pourrez recevoir ce qu'Il a rendu disponible.<br><br>Avez-vous limité Dieu? Pourquoi ne pas libérer la puissance de Dieu qui est latente en vous, et croire Dieu pour l'abondance qu'Il a promise?"], "n": [25, 26, 27]}, "22": {"t": "Chapitre 4 · La vie synchronisée", "p": ["Chapitre Quatre LA VIE SYNCHRONISEE Tout ce qu'un individu croit se reflète directement dans ce qu'il confesse.<br><br>Ce qu'un individu confesse du plus profond de son être est ce qu'il manifeste dans sa vie. Si un individu passe sa vie à confesser qu'il est dans le besoin, il sera définitivement dans le besoin. S'il confesse la maladie, il continuera à être malade et affligé à cause de la loi qui veut que ce que quelqu'un croit au fond de son âme apparaisse indubitablement dans sa vie.<br><br>La \"vie synchronisée\" est énoncée simplement par la formule suivante: la confession de la croyance donne le résultat de la confession. Si vous confessez de votre bouche ce que dit la Parole, en même temps que vous le confessez dans votre coeur, vous aurez la puissance. A mesure que vous appliquerez ces clés dans votre vie par vos actions, vos prières seront exaucées.<br><br>Ainsi, les ressources abondantes du ciel vous seront rendues disponibles. Mais, de même, si vous confessez simultanément avec votre bouche et votre coeur les négations de ce monde, vous manifesterez ces négations paralysantes .<br><br>Si vous confessez le Christ en tant que seigneur dans votre vie, votre confession est pour vous une réalité. Vous savez dans votre coeur qu'il est le seigneur parce que vous croyez que Dieu l'a ressuscité des morts. Lorsque vous confessez que", "vous êtes une nouvelle créature en Christ, les choses anciennes sont passées et toutes choses deviennent nouvelles selon votre confession. Si vous confessez que vous êtes un fils de Dieu et la Bible dit que vous êtes un fils, alors vous êtes un fils de Dieu. Si votre confession dit que vous êtes un héritier du Père, alors tout ce que le Père possède devient vôtre parce que vous confessez exactement ce que dit la Parole.<br><br>La Parole déclare que le Diable a été et est vaincu.<br><br>Elle stipule qu'il n'a aucun droit légal sur le Chrétien. Si Satan n'a aucun pouvoir sur le Chrétien, pourquoi voulez- vous confesser qu'il a pouvoir sur vous? Chaque fois que vous faites une confession négative, vous contredites la Parole de Dieu. Si la puissance du Diable est vaincue, comme elle l'est, alors sa puissance ne peut vous toucher lorsque vous croyez la Parole.<br><br>Mais, vous devez confesser que vous connaissez la puissance de Dieu dans votre vie. Vous devez confesser ce que Dieu dit dans Sa Parole et alors la Parole deviendra une réalité dans votre vie. Chaque fois que vous osez confesser que vous êtes ce que la Parole dit que vous êtes, et vous agissez selon ce qu'enseigne la Parole, vous verrez que vos prières seront exaucées.<br><br>Aussi longtemps que je ne réussis pas à coordonner ma bouche et mon coeur sur un point quelconque qui est confirmé par la Parole, je n'ai aucune puissance avec Dieu. Lorsque je confesse que Dieu n'exauce pas ma prière, qu'Il ne m'aime pas, que", "j'ai une maladie parce que Dieu me l'a donnée, ou que je suis lié par quelque chose de mauvais parce que c'est la volonté de Dieu que je sois ainsi châtié dans la vie, ou que je dois souffrir pour la gloire de Dieu--alors je ne dis pas ce que dit la Parole et je manifesterai dans ma vie le résultat de ma confession.<br><br>Psaumes 18 contient une très belle comparaison qui illustre comment nous devons coordonner notre intelligence et nos actions.<br><br>Psaumes 18:34:<br><br>Il rend mes pieds semblables à ceux des biches, Et il me place sur mes lieux élevés.<br><br>Une biche est une mère cerf, un des animaux aux pieds les plus sûrs au monde.<br><br>Lorsqu'elle franchit le versant d'une montagne avec ses petits à sa suite, elle place ses pieds arrières exactement là où ses pieds avants avaient d'abord été placés pour vérifier la présence de pierres détachées sur la pente. Si elle ne vérifiait pas cette pente rocailleuse avec ses pieds avants, les pierres détachées la feraient glisser et tomber dans le ravin au-dessous d'elle. Cette façon précise d'avancer représente la vie tant pour la biche que pour ses petits.<br><br>\"Il rend mes pieds semblables à ceux des biches.\" Il rend. C'est-à-dire, Il fait en sorte que je puisse apprendre à marcher selon la Parole de sorte que mes \"pieds arrières\" suivront mes \"pieds"], "n": [33, 34, 35]}, "23": {"t": "Chapitre 4 · La vie synchronisée", "p": ["avants\" (représentant la Parole). Ainsi, là où la Parole a placé ses pieds, là aussi je placerai mes pieds.<br><br>Si vous vous appuyez sur la Parole de Dieu et que vous confessez cette Parole, vous devenez ce que dit la Parole de Dieu.<br><br>Ceci est la vie synchronisée.<br><br>Romains nous dit combien chers et puissants sont les enfants de Dieu.<br><br>Romains 8:35-37:<br><br>Qui nous séparera de l'amour de Christ? Sera-ce la tribula-tion, ou l'angoisse, ou la persécution, ou la faim, ou la nudité, ou le péril, ou l'épée? selon qu'il est écrit:<br><br>C'est à cause de toi qu'on nous met à mort tout le jour, Qu'on nous regarde comme des brebis destinées à la boucherie.<br><br>Mais dans toutes ces choses nous sommes plus que vainqueurs par celui qui nous a aimés.<br><br>Ce n'est pas moi qui dit ceci; Dieu l'a dit. Croyez-vous la Parole de Dieu?<br><br>Il dit que vous êtes plus que vainqueur par celui qui vous a aimé.<br><br>Romains 8:38,39:<br><br>Car j'ai l'assurance que ni la mort ni la vie, ni les anges ni les dominations, ni les choses présentes ni les choses à venir,", "ni les puissances, ni la hauteur ni la profondeur, ni aucune autre créature ne pourra nous séparer de l'amour de Dieu manifesté en Jésus-Christ notre Seigneur.<br><br>Ceci est la Parole déclarée, confirmée, de Dieu. Lorsque vous commencez à confesser cette Parole, elle devient une réalité dans votre vie. Jusqu'alors vous serez vaincu par les dominations et autorités sataniques de toute part, à cause de votre confession. Connaissez la Parole, confessez la Parole et agissez selon la Parole. C'est ce que veut dire une vie synchronisée.<br><br>Décidez maintenant que jamais plus vous ne ferez une confession négative.<br><br>Apprenez quoi confesser et comment. Confessez du coeur, avec votre bouche, ce qui a été confirmé par la Parole. Confessez ce que la Bible dit que vous êtes, non pas ce que vous pensez que vous êtes, non pas ce que votre voisin immédiat dit que vous êtes, non pas ce que votre meilleur ami puisse dire que vous êtes. Cramponnez-vous à ce que dit la Parole.<br><br>Nous avons été délivrés de la puissance des ténèbres: Satan, le vice et le mal.<br><br>Colossiens 1:13:<br><br>Qui nous a délivrés de la puissance des ténèbres et nous a transportés dans le royaume du ‹par le > Fils de son amour. * *La traduction littérale selon l'acception", "La prochaine fois que des pensées mauvaises ou négatives vous viendront à l'esprit, déclarez immédiatement la Parole \"Je confesse que j'ai été délivré et dites,. de la puissance des ténèbres par mon seigneur et sauveur, Jésus-Christ\". Continuez à dire ceci et bientôt ce sera une réalité dans votre vie. Si vous avez été transporté dans le Royaume de Dieu par l'oeuvre du Fils de Son amour, alors vous n'êtes pas dans le royaume du Diable. Croyez- vous que vous puissiez être dans le Royaume de Dieu et dans celui du Diable en même temps? Il nous a délivrés de la puissance du mal et nous sommes dans le Royaume de Dieu.<br><br>Les gens croient qu'ils doivent s'efforcer de devenir bons avant que Dieu les bénisse. Je vous assure que Dieu ne vous bénira jamais parce que vous êtes bon, mais bien parce que vous croyez. Comment vous débarrassez-vous de l'obscurité dans une pièce? L'obscurité disparaît aussi rapidement que la lumière arrive. Ainsi, lorsque nous permettons à la lumière de La Parole de pénétrer dans nos vies, l'obscurité est dispersée. Il n'y a rien dans La Parole qui fasse mention de sentiments, elle dit croyez. Tout ce que Dieu a donné vous vient par la croyance, sans égard au fait que vous soyez bon ou mauvais. Ceci venu apporter. est l'amour. C'est ce que le Christ est venu apporter est: \"Qui nous a délivrés hors de l'exercice ou de l'influence active des ténèbres (Le royaume des) et nous a séparés, nous amenant en tant que citoyens dans Son roy aume, par l'oeuvre du Fils de Son amour.\"", "Quand nous agissons selon les promesses de Dieu, elles nous deviennent réelles et se manifestent dans nos vies. Synchronisez votre croyance et votre confession sur les promesses de la Parole de Dieu et vous manifesterez une vie dans l'abondance en Christ-Jésus."], "n": [36, 37, 38, 39]}, "24": {"t": "Chapitre 5 · La loi de la croyance", "p": ["Chapitre Cing LA LOI DE LA CROYANCE Je sais que la vie abondante est disponible aujourd'hui à ceux qui comprennent et appliquent la loi de la croyance.<br><br>A ce sujet, je veux attirer votre attention à Marc 9. Ceci est une histoire plutôt longue; mais si je dois vous enseigner la 101 de la croyance, vous devez assimiler la verite de ce récit dans votre coeur et dans votre vie.<br><br>Marc 9:14-27:<br><br>Lorsqu'ils furent arrivés près des disciples, ils virent autour d'eux une grande foule, et des scribes qui discutaient avec eux.<br><br>Dès que la foule vit Jésus, elle fut surprise, et on accourut pour le saluer.<br><br>Il leur demanda: Sur quoi discutez-vous avec eux?<br><br>Et un homme de la foule lui répondit: Maître, j'ai amené auprès de toi mon fils, qui est possédé d'un esprit muet.<br><br>En quelque lieu qu'il le saisisse, il le jette par terre; l'enfant devien grince des dents, prié", "tes disciples de chasser l'esprit, et ils n'ont pas pu.<br><br>Race incrédule, leur dit Jésus, jusques à quand serai-je avec vous? jusques à quand vous supporterai-je? Amenez-le-moi.<br><br>On le lui amena.<br><br>Et aussitôt que l'enfant vit Jésus, l'esprit l'agita avec violence; il tomba par terre, et se roulait en écumant.<br><br>Jésus demanda au père: Combien y a-t-il de temps que cela lui arrive? Depuis son enfance, répondit-il.<br><br>Et souvent l'esprit l'a jeté dans le feu et dans l'eau pour le faire périr. Mais, si tu peux quelque chose, viens à notre secours, aie compassion de nous.<br><br>Jésus lui dit: Si tu peux!....<br><br>Tout est possible à celui qui croit.<br><br>Aussitôt le père de l'enfant s'écria:<br><br>Je crois! viens au secours de mon incrédulité!<br><br>Jésus, voyant accourir la foule, menaça l'esprit impur, et lui dit: Esprit muet et sourd, je te l'ordonne, sors de cet enfant, et n' y rentre plus.", "eris, et en 'a pousse dane grande violence. L'enfant devint comme mort, de sorte que plusieurs disaient qu'il était mort.<br><br>Mais Jésus, l'ayant pris par la main, le fit lever. Et il se tint debout.<br><br>L'homme amena son fils pour le faire guérir. Il rapporta à Jésus que les disciples ne pouvaient remédier à la situation. Les disciples devaient se sentir stupides car ceci était une démonstration publique et personne en privé, et encore moins en public, ne veut avoir l'air d'un idiot. Il s'agissait des mêmes disciples qui auparavant avaient eu beaucoup de victoires et de succès dans la guérison des malades. Maintenant, ils étaient arrivés à une impasse. Qu'est-ce qui les entravaient?<br><br>Jésus perçut le problème immédiatement lorsque le père dit, \"Si tu peux quelque chose, viens à notre secours, aie compassion de nous.\" Jésus prit ce \"si\" que le père avait d'abord dirigé vers les disciples et ensuite vers Jésus, et le re-conna au père, où il appartenait. \"Jésus lui dit: Si tu peux!.... Tout est possible à celui qui croit.\" Beaucoup de gens aiment blâmer quelqu'un d'autre pour leur incroyance et leur incapacité à recevoir.<br><br>Les disciples furent victimes du blâme en cette occasion. Les disciples furent pris dans le piège de cet homme, mais non Jésus. Beaucoup de gens aimeraient que", "d'autres croient pour eux; ils ne veulent tout simplement pas apprendre comment croire pour eux-mêmes. Souvent, les gens ne savent tout simplement pas comment croire.<br><br>Jésus comprit clairement la situation et il dit au père de l'enfant:<br><br>\"Si tu peux croire. Je sais que mes disciples croient, et ce n'est pas leur faute s'ils n'ont pu enlever la cause.<br><br>Ils pourraient croire pour ton enfant jusqu'à la fin des temps sans aucun résultat; mais si tu peux croire, alors quelque chose surviendra.\"<br><br>Chaque fois que possible, Jésus demandait toujours la croyance. Lorsque nous étudions les miracles de guérison, nous constatons que Jésus exigeait la croyance des parents pour la guérison de leurs enfants. Par exemple, en Matthieu 15:22 nous voyons que la femme cananéenne avait une grande croyance en la guérison de sa fille qui était tourmentée par un démon.<br><br>Dans le cas de déments, qui sont incapables mentalement, la croyance n'était pas exigée.<br><br>Comme exemples de tels cas citons: Marc 1:23svt et Luc 4:33svt; Matthieu 8:16svt; Marc 1:32svt; Luc 4:41; Matthieu 8:28svt; Luc 8:26svt; Marc 5:1svt; Matthieu 9:32 et Actes 16:16.<br><br>Dans le cas de résurrections de morts, telles que relatées en Marc 5:35svt et Luc 8:49svt, nous lisons que Jésus dit au père de l'enfant morte, \"Ne crains pas, crois seulement.\" Lorsque Jésus a ressuscité Lazare des morts, le passage ne dit pas que quiconque ait cru sauf Jésus. En Actes 9:36svt, où Pierre ressuscita Dorcas des morts, il fit sortir tout le monde de"], "n": [41, 42, 43, 44]}, "25": {"t": "Chapitre 5 · La loi de la croyance", "p": ["la chambre puis il pria et lui ordonna de se lever.<br><br>Dans chaque récit biblique, la croyance est toujours exigée de la part de tous ceux qui ont un besoin, à l'exception des cas énoncés ci-dessus: certains genres de dérangement mental, les morts et les enfants.<br><br>Il y a de la puissance dans la croyance. Il y a dans ce monde une puissance à laquelle vous et moi, en tant que croyants nés de nouveau, avons facilement accès. Cette puissance nous permettra de surmonter nos défauts et nos difficultés, apportant à nos vies l'affranchissement et la victoire. Cette puissance vient de Dieu. Il est présent partout, ce qui veut dire qu'Il est avec vous en ce moment même. La clé consiste à connaître et à recevoir Sa puissance, qui est la base sur laquelle toute la vie abondante repose. La loi de la croyance apporte des résultats prodigieux à tous ceux qui en appliquent et en pratiquent les principes.<br><br>Vous pouvez croire correctement ou mal. La croyance fonctionne dans les deux sens et vous vous attirez ce que vous croyez. Matthieu 9 et Job 3 nous montrent les genres de croyance et leurs résultats Matthieu 9:20-22:<br><br>Et voici, une femme atteinte d'une perte de sang depuis douze ans s'approcha par derrière, et toucha le bord de son vêtement.<br><br>Car elle disait en elle-même: Si", "je puis seulement toucher son vêtement, je serai guérie.<br><br>Jésus se retourna, et dit, en la voyant: Prends courage, ma fille, ta foi ‹ croyance> t'a guérie...<br><br>Job 3:25:<br><br>Ce que je crains ‹ crois›, c'est ce qui m'arrive:<br><br>Ce que je redoute, c'est ce qui m'atteint.<br><br>La crainte, l'inquiétude et l'anxiété sont des genres de croyance. Si vous vous inquiétez, avez des craintes et êtes anxieux, vous recevrez le fruit de votre croyance négative qui est l'échec.<br><br>La loi de la croyance est aussi efficace pour le pécheur que pour le saint; cependant, le croyant, à cause de l'esprit de Dieu en lui, peut produire plus abondamment. Si vous doutez de votre rétablissement d'une maladie, vous ralentirez et retarderez indubitablement votre propre progrès. Croire correctement c'est savoir constamment que la puissance et la présence de Dieu sont en vous et avec vous en toute situation! La façon dont vous pensez au problème auquel vous devez faire face en ce moment même en déterminera l'aboutissement. Si vous doutez de son succès, vous son, par votre propre croyance, déterminé son aboutissement infructueux.<br><br>Appliquez la méthode positive de la loi de la croyance à chaque situation de la vie, à chaque problème qui se présente à vous, car", "si tu peux croire, \"Tout est possible à celui qui croit.\"<br><br>La récitation de quelque prière solennelle ne vous affranchira jamais ni n'apportera des résultats positifs à votre vie. A ce jeu de la vie, vous ne pouvez espérer, penser ou deviner. Vous croyez tout simplement que Dieu est en vous et qu'Il est toujours avec vous, jusqu'à la fin des temps.<br><br>I Jean 4:4: ...celui qui est en vous est plus grand que celui qui est dans le monde.<br><br>Les influences malfaisantes du monde ne peuvent jamais vous faire faire ce qui est mal à moins que vous ne le permettiez par votre propre faiblesse de caractère ou votre manque de croyance.<br><br>Lorsque vous aurez commencé à pratiquer la loi de la croyance--en croyant correctement, en croyant Dieu--vous verrez que les choses néfastes qui gouvernaient votre vie s'estomperont bientôt. Dieu est toujours le vainqueur du mal, mais il tient à vous de croire Dieu et faire de Sa volonté votre volonté.<br><br>Dans toutes les épitres du Nouveau restament, vous ne verrez jamais des croyants chrétiens être incités à avoir la foi; ils ont déjà la foi en tant que croyants, et ils sont encouragés à croire Dieu et à exprimer ce qu'ils ont déjà.<br><br>Romains 12:3: selon la mesure de foi que", "Dieu a départie à chacun.<br><br>Le mot \"croire\" est un verbe qui im-plíque une action. Donc, croire la Parole de Dieu, prendre la Parole de Dieu littéralement et agir selon cette Parole produit des résultats. Ceci est la loi de la croyance et ceci est l'action qui apportera l'affranchissement et la victoire à votre vie en toute situation. Si tu peux croire, ‘’ Tout est possible <actuellement disponible > à celui qui croit. ‘’"], "n": [45, 46, 47, 48]}};const REF={"1": "Éphésiens 1:1-14", "2": "Éphésiens 1:15-23", "3": "Éphésiens 2:1-10", "4": "Éphésiens 2:11-22", "5": "Éphésiens 3:1-10", "6": "Éphésiens 3:11-21", "7": "Éphésiens 4:1-10", "8": "Éphésiens 4:11-21", "9": "Éphésiens 4:22-32", "10": "Éphésiens 5:1-10", "11": "Éphésiens 5:11-21", "12": "Éphésiens 5:22-33", "13": "Éphésiens 6:1-8", "14": "Éphésiens 6:9-15", "15": "Éphésiens 6:16-24", "26": "Psaumes 4:2; 5:3; 6:10; 17:1", "27": "Psaumes 39:13; 42:9; 54:4; 55:2", "28": "Psaumes 61:2; 65:3; 66:19; 66:20", "29": "Psaumes 69:14; 84:9; 88:3", "30": "Psaumes 88:14; 102:2; 102:18; 143:1"};const VERS={"1": "<p><sup>1</sup> Paul, apôtre de Jésus-Christ par la volonté de Dieu, aux saints et fidèles en Jésus-Christ, qui sont à Éphèse.</p><p><sup>2</sup> La grâce et la paix vous soient données de la part de Dieu notre Père et Seigneur, JÉSUS-CHRIST!</p><p><sup>3</sup> Béni soit Dieu le Père, notre Seigneur Jésus-Christ, qui nous a bénis de toutes sortes de bénédictions spirituelles dans les lieux célestes, en Christ;</p><p><sup>4</sup> Selon qu'il nous a élus au salut en lui avant la fondation du monde, afin que nous soyons saints et sans reproches devant lui dans la charité;</p><p><sup>5</sup> Nous ayant prédestinés au salut pour être ses enfants adoptifs par le moyen de Jésus-Christ, d'après le bon plaisir de sa volonté;</p><p><sup>6</sup> A la louange de la gloire de sa grâce, qu'il nous a gratuitement accordée en son Bien-aimé.</p><p><sup>7</sup> En qui nous avons la rédemption par son sang, la rémission des péchés, selon les richesses de sa grâce,</p><p><sup>8</sup> Qu'il a répandue sur nous abondamment par toute sorte de sagesse et d'intelligence;</p><p><sup>9</sup> Nous ayant fait connaître le mystère de sa volonté selon le dessein bienveillant qu'il avait auparavant résolu en lui-même,</p><p><sup>10</sup> Et qu'il devait réaliser à l'accomplissement des temps, à savoir de réunir toutes choses en Christ, tant ce qui est dans les cieux, que ce qui est sur la terre; en lui-même:</p><p><sup>11</sup> C'est en lui aussi que nous sommes devenus héritiers, ayant été prédestinés au salut, d'après le décret de Celui qui opère toutes choses selon le conseil de sa volonté;</p><p><sup>12</sup> Afin que nous servions à la louange de sa gloire, nous qui avons les premiers cru en Christ.</p><p><sup>13</sup> En lui vous êtes aussi, après avoir entendu la Parole de la vérité, l'Évangile de votre salut, et avoir cru en lui, vous avez été scellés du Saint-Esprit qui avait été promis;</p><p><sup>14</sup> Lequel est un garantie de notre héritage, pour la rédemption de ceux qu'il s'est acquis, à la louange de sa gloire.</p>", "2": "<p><sup>15</sup> C'est pourquoi, ayant aussi entendu parler de votre foi au Seigneur Jésus, et de votre charité envers tous les saints,</p><p><sup>16</sup> Je ne cesse de rendre grâces pour vous, en faisant mention de vous dans mes prières;</p><p><sup>17</sup> Afin que le Dieu de nous tous, notre Seigneur Jésus-Christ, le Père de gloire, vous donne un esprit de sagesse et de révélation dans sa connaissance;</p><p><sup>18</sup> Qu'il éclaire les yeux de votre entendement; afin que vous connaissiez quelle est l'espérance à laquelle vous êtes appelés, et quelles sont les richesses de la gloire de son héritage dans les saints;</p><p><sup>19</sup> Et quelle est, envers nous qui croyons, l'infinie grandeur de sa puissance, conformément à l'efficacité du pouvoir de sa force,</p><p><sup>20</sup> Qu'il a déployée en Christ, quand il l'a ressuscité des morts, et qu'il l'a fait asseoir à sa droite dans les lieux célestes,</p><p><sup>21</sup> Au-dessus de toute principauté, de toute puissance, de tout pouvoir, de toute domination, et de tout nom qui se puisse nommer, non seulement dans ce siècle, mais aussi dans celui qui est à venir.</p><p><sup>22</sup> Et il a mis toutes choses sous ses pieds, et l'a donné pour Chef suprême (la Tête) de l'Église,</p><p><sup>23</sup> Qui est son corps, et la plénitude de celui qui remplit tout en tous.</p>", "3": "<p><sup>1</sup> Et vous étiez morts dans vos offenses et dans vos péchés,</p><p><sup>2</sup> Dans lesquels vous avez marché autrefois, selon la coutume de ce monde, selon le prince de la puissance de l'attitude, de cet esprit qui agit maintenant dans les fils de la rébellion;</p><p><sup>3</sup> Parmi lesquels nous vivions tous autrefois, selon les convoitises de notre chair, accomplissant les désirs de la chair et de nos pensées; et nous étions par nature des enfants de colère, comme les autres.</p><p><sup>4</sup> Mais Dieu, qui est riche en miséricorde à cause de la grande charité dont il nous a aimés,</p><p><sup>5</sup> Lorsque nous étions morts dans nos péchés, nous a rendus à la vie ensemble en Christ, c'est par sa grâce irrésistible que vous êtes sauvés.</p><p><sup>6</sup> Et il nous a ressuscités ensemble, et fait asseoir ensemble dans les lieux célestes, en Jésus-Christ;</p><p><sup>7</sup> Afin de montrer dans les siècles à venir les immenses richesses de sa grâce, par sa bonté envers nous en Jésus-Christ.</p><p><sup>8</sup> Car vous êtes sauvés par la grâce, par le moyen de la foi; et cela ne vient pas de vous ou de votre choix, c'est le don de Dieu;</p><p><sup>9</sup> Ce n'est point par les oeuvres méritoires, afin que personne ne se glorifie.</p><p><sup>10</sup> Car nous sommes son ouvrage, ayant été créés en Jésus-Christ pour les tâches convenables, que Dieu a préparées d'avance, afin que nous y marchions.</p>", "4": "<p><sup>11</sup> C'est pourquoi, souvenez-vous que vous, qui étiez autrefois Gentils en la chair, et qui étiez appelés incirconcis par ceux qu'on appelle circoncis dans la chair par la main de l'homme,</p><p><sup>12</sup> Vous étiez en ce temps-là sans Christ, séparés de la république d'Israël, étrangers par rapport aux alliances de la promesse, n'ayant point d'espérance, et sans Dieu dans le monde.</p><p><sup>13</sup> Mais maintenant, en Jésus-Christ, vous qui étiez autrefois éloignés, vous êtes rapprochés par le sang de Christ.</p><p><sup>14</sup> Car c'est lui qui est notre paix, lui qui des deux peuples n'en a fait qu'un, en abattant le mur de séparation;</p><p><sup>15</sup> Ayant détruit en sa chair l'hostilité, la loi des préceptes, laquelle consistait en ordonnances ritualistes; afin qu'il formât en lui-même des deux un seul homme nouveau, après avoir fait la paix;</p><p><sup>16</sup> Et qu'en détruisant lui-même l'hostilité, il réconciliât avec Dieu, par la croix, les uns et les autres en un seul corps.</p><p><sup>17</sup> Et il est venu annoncer la paix, à vous qui étiez loin, et à ceux qui étaient près;</p><p><sup>18</sup> Car par lui nous avons, les uns et les autres, accès auprès du Père, dans un même Esprit.</p><p><sup>19</sup> Ainsi, vous n'êtes plus ni des inconnus, ni des étrangers, mais concitoyens des Saints, et de la famille de Dieu;</p><p><sup>20</sup> Étant édifiés sur le fondement des apôtres et des prophètes, dont Jésus-Christ est la pierre angulaire,</p><p><sup>21</sup> En qui tout l'édifice, bien coordonné, s'élève pour être un temple saint au Seigneur,</p><p><sup>22</sup> En qui aussi vous êtes édifiés ensemble, pour être l'habitation de Dieu par l'Esprit.</p>", "5": "<p><sup>1</sup> C'est à cause de cela que moi, Paul, je suis le prisonnier de Jésus-Christ pour vous, les Gentils;</p><p><sup>2</sup> Si en effet vous avez appris quelle est la libéralité de la grâce de Dieu, qui m'a été donnée pour vous;</p><p><sup>3</sup> C'est par révélation qu'Il m'a fait connaître ce mystère, comme je viens de l'écrire en peu de mots.</p><p><sup>4</sup> Par où vous pouvez comprendre en lisant, quelle est l'intelligence que j'ai du mystère de Christ,</p><p><sup>5</sup> Mystère qui n'a pas été manifesté aux enfants des hommes dans les générations passées, comme il a été révélé maintenant, par l'Esprit, à ses saints apôtres et aux prophètes;</p><p><sup>6</sup> Savoir, que les Gentils sont cohéritiers, et qu'ils font un même corps, et qu'ils participent à sa promesse en Christ par l'Évangile;</p><p><sup>7</sup> Duquel j'ai été fait ministre, par un don de la grâce de Dieu, qui m'a été donnée par l'efficace de sa puissance.</p><p><sup>8</sup> C'est à moi, le moindre de tous les saints, qu'a été donnée cette grâce d'annoncer, parmi les Gentils, les richesses incompréhensibles de Christ,</p><p><sup>9</sup> Et de mettre en évidence devant tous, quelle est l'association du mystère caché de tout temps en le seul Dieu, qui a créé toutes choses, le Seigneur Jésus-Christ,</p><p><sup>10</sup> Afin que la sagesse de Dieu, infiniment diverse, soit maintenant manifestée par l'Appel à Renaître aux dirigeants et aux puissances dans les positions élevés,</p>", "6": "<p><sup>11</sup> Selon le dessein qu'il a déterminé de tout temps, et qu'il a exécuté par Jésus-Christ, notre Seigneur,</p><p><sup>12</sup> En qui nous avons la liberté de nous approcher de Dieu avec confiance, par la foi qui nous a été donné d'avoir en lui.</p><p><sup>13</sup> C'est pourquoi je vous demande de ne pas vous décourager à cause des afflictions que j'endure pour vous; elles sont votre gloire.</p><p><sup>14</sup> C'est pour ce sujet que je fléchis les genoux devant notre Père, le Seigneur Jésus-Christ,</p><p><sup>15</sup> De qui toute famille, dans les cieux et sur la terre, tire son nom;</p><p><sup>16</sup> Afin que, selon les richesses de sa gloire, il vous donne d'être puissamment fortifiés par son Esprit, dans l'homme intérieur,</p><p><sup>17</sup> Afin que Christ habite dans vos cœurs par la foi que vous avez reçu;</p><p><sup>18</sup> Et que, enracinés et fondés dans la charité, vous puissiez comprendre, avec tous les saints, quelle en est la largeur, la longueur, la profondeur et la hauteur,</p><p><sup>19</sup> Et connaître l'amour sacrificiel de Christ, qui surpasse toute connaissance, afin que vous soyez remplis de toute la plénitude de Dieu.</p><p><sup>20</sup> Or, à Celui qui peut faire, par la puissance qui agit en nous, infiniment plus que tout ce que nous demandons et que nous pensons;</p><p><sup>21</sup> A Lui soit la gloire de l'Appel à Renaître en Jésus-Christ, dans tous les âges, aux siècles des siècles! Amen.</p>", "7": "<p><sup>1</sup> Je vous exhorte donc, moi le prisonnier du Seigneur, à vous conduire d'une manière digne de l'appel efficace par lequel vous avez été convoqué,</p><p><sup>2</sup> En toute humilité et douceur, avec tolérance, vous supportant les uns les autres avec charité;</p><p><sup>3</sup> Vous appliquant à conserver l'unité de l'esprit, par le lien de la paix.</p><p><sup>4</sup> Il y a un seul corps et un seul Esprit, comme aussi vous êtes convoqués à une seule espérance, par votre appel à renaître.</p><p><sup>5</sup> Un seul Seigneur, une seule foi, un seul engagement;</p><p><sup>6</sup> Un seul Dieu et Père de tous, qui est au-dessus de tous, et par tous, et en vous tous.</p><p><sup>7</sup> Mais la grâce est donnée à chacun de nous, selon la mesure du don de Christ.</p><p><sup>8</sup> C'est pourquoi, il est dit: Étant élevé dans l'éminence, il a emmené en soumission la captivité, et il a distribué des dons aux hommes.</p><p><sup>9</sup> Or, que signifie: Il est élevé, si ce n'est qu'auparavant il s'était abaissé parmi les cas méprisés de la terre?</p><p><sup>10</sup> Celui qui s'est humilié, c'est le même qui est élevé au-dessus de tous les cieux, afin qu'il remplît toutes choses.</p>", "8": "<p><sup>11</sup> C'est aussi lui qui a établi les uns apôtres, les autres interprètes, les autres évangélistes, et les autres bergers et instructeurs;</p><p><sup>12</sup> Pour le perfectionnement des saints, pour l'œuvre du ministère de l'édification première du corps de Christ;</p><p><sup>13</sup> Jusqu'à ce que nous soyons tous parvenus à l'unité de la foi et de la connaissance du Fils de Dieu, à l'état d'homme fait, à la mesure de la pleine majesté de Christ;</p><p><sup>14</sup> Pour que nous ne soyons plus des petits enfants, flottants et emportés çà et là à tous vents de doctrine, par la tromperie des hommes, et par les pièges rusés avec lesquels ils veulent nous séduire subtilement;</p><p><sup>15</sup> Mais que, professant la vérité dans la charité, nous croissions en toutes choses dans celui qui est le Chef (la Tête), Christ;</p><p><sup>16</sup> De qui tout le corps, bien coordonné et étroitement uni, par l'assistance de toutes les jointures, tire son accroissement, selon la force assignée à chaque membre, afin qu'il soit édifié lui-même dans la charité.</p><p><sup>17</sup> Voici donc ce que je dis et que j'atteste de la part du Seigneur: Ne vous conduisez plus comme le reste des Gentils, qui suivent la vanité de leur raisonnement;</p><p><sup>18</sup> Ayant leur intelligence obscurcie, étant éloignés de la vie de Dieu, à cause de l'ignorance qui est en eux, à cause de l'endurcissement de leur cœur;</p><p><sup>19</sup> Ayant perdu tout sentiment, ils se sont abandonnés à la débauche, pour commettre toutes sortes d'impuretés, avec une ardeur insatiable.</p><p><sup>20</sup> Mais vous, ce n'est pas ainsi que vous avez appris à connaître Christ;</p><p><sup>21</sup> Au moins, si vous l'avez écouté, et si, selon la vérité qui est en Jésus, vous avez été instruits en lui,</p>", "9": "<p><sup>22</sup> A vous débarasser, pour ce qui est de votre conduite précédente, du vieil homme, qui se corrompt par les convoitises trompeuses;</p><p><sup>23</sup> A vous renouveler par l'Esprit dans votre entendement;</p><p><sup>24</sup> Et à vous revêtir du nouvel homme, créé à l'image de Dieu, dans la justice et la sainteté de la vérité.</p><p><sup>25</sup> C'est pourquoi, ayant supprimé le mensonge, que chacun parle selon la vérité à son prochain, car nous sommes membres les uns des autres.</p><p><sup>26</sup> Si vous vous mettez en colère, ne péchez point; que le soleil ne se couche point sur votre colère;</p><p><sup>27</sup> Et ne donnez point accès à l’accusateur.</p><p><sup>28</sup> Que celui qui dérobait ne dérobe plus; mais qu'il travaille plutôt de ses mains à quelque chose de bon, afin qu'il ait de quoi donner à celui qui est dans le besoin.</p><p><sup>29</sup> Qu'il ne sorte de votre bouche aucune mauvaise parole; mais que vos paroles soient propres à édifier efficacement, et qu'elles puissent administrer la grâce à ceux qui les entendent.</p><p><sup>30</sup> Et n'attristez point le Saint-Esprit de Dieu, par lequel vous avez été scellés pour le jour de la rédemption.</p><p><sup>31</sup> Que toute amertume, toute hostilité, toute colère, toute discorde, toute médisance soient bannies du milieu de vous, ainsi que toute méchanceté.</p><p><sup>32</sup> Mais soyez, les uns envers les autres, bons, miséricordieux, vous pardonnant les uns aux autres, comme Dieu vous a aussi pardonné en Christ.</p>", "10": "<p><sup>1</sup> Soyez donc les imitateurs de Dieu, comme des enfants bien-aimés;</p><p><sup>2</sup> Et marchez dans la charité, comme le Christ qui nous a aimés, et s'est offert lui-même à Dieu pour nous comme une offrande et un sacrifice d'odeur agréable.</p><p><sup>3</sup> Que ni la fornication, ni aucune impureté, ni l'avarice, ne soient même nommées parmi vous, comme il convient à des saints;</p><p><sup>4</sup> Ni aucune obscénité, ni bouffonnerie, ni moquerie, qui sont des choses malséantes; mais qu'on y entende plutôt des actions de grâces.</p><p><sup>5</sup> Car vous savez ceci, qu'aucun pervers, ou licencieux, ou matérialiste, qui est un idolâtre, n'a part à l'héritage du royaume de Christ et de Dieu.</p><p><sup>6</sup> Que personne ne vous séduise par de vains discours; car c'est à cause de ces choses que la colère de Dieu vient sur les enfants rebelles.</p><p><sup>7</sup> N'ayez donc point de part avec eux.</p><p><sup>8</sup> Car vous étiez autrefois ténèbres, mais à présent vous êtes lumière dans le Seigneur; marchez comme des enfants de lumière;</p><p><sup>9</sup> Car le fruit de l'Esprit consiste en toute sorte de bonté, de droiture et de vérité.</p><p><sup>10</sup> Examinez ce qui est agréable au Seigneur.</p>", "11": "<p><sup>11</sup> Et ne prenez aucune part aux oeuvres infructueuses des ténèbres, mais bien plutôt condamnez-les.</p><p><sup>12</sup> Car il est même honteux de dire ce que ces gens font en secret.</p><p><sup>13</sup> Mais tout ce qui est condamné est manifesté par la lumière; car tout ce qui est manifesté devient lumière.</p><p><sup>14</sup> C'est pour cela qu'il est dit: Réveille-toi, toi qui dors, et relève-toi d'entre les morts, et Christ t'éclairera.</p><p><sup>15</sup> Prenez donc garde à vous conduire avec réflexion, non comme des insensés, mais comme des personnes sages;</p><p><sup>16</sup> Rachetez le temps; car les jours sont mauvais.</p><p><sup>17</sup> C'est pourquoi ne soyez pas sans prudence, mais comprenez quelle est la volonté du Seigneur.</p><p><sup>18</sup> Ne vous enivrez point de vin à l'éperdument; mais soyez remplis de l'Esprit;</p><p><sup>19</sup> Entretenez-vous ensemble par des psaumes, des hymnes et des cantiques spirituels, chantant et psalmodiant dans votre cœur au Seigneur;</p><p><sup>20</sup> Rendez grâces toujours pour toutes choses, au nom de notre Seigneur Jésus-Christ, notre Dieu et Père.</p><p><sup>21</sup> Soumettez-vous les uns aux autres dans la crainte de Dieu.</p>", "12": "<p><sup>22</sup> Femmes, soyez dépendantes de vos propres maris, comme au Seigneur,</p><p><sup>23</sup> Parce que le mari est le chef de la femme, comme aussi le Christ est le chef de l'Église, qui est son corps, dont il est le Sauveur.</p><p><sup>24</sup> Or, de même que l'Église est dépendante de Christ, que les femmes le soient aussi à leurs propres maris en toutes choses.</p><p><sup>25</sup> Maris, aimez vos femmes, comme aussi Christ a aimé l'Église, et s'est livré lui-même pour elle;</p><p><sup>26</sup> Afin de la sanctifier, en la consacrant et la blanchissant par l'eau de la Parole;</p><p><sup>27</sup> Pour la faire paraître devant lui une Église glorieuse, sans tache, ni ride, ni rien de semblable, mais sainte et irrépréhensible.</p><p><sup>28</sup> C'est ainsi que les maris doivent aimer leurs femmes comme leurs propres corps. Celui qui aime sa femme, s'aime lui-même.</p><p><sup>29</sup> Car personne n'a jamais haï sa propre chair, mais il la nourrit et l'entretient, comme le Seigneur le fait à l'égard de l'Église;</p><p><sup>30</sup> Parce que nous sommes les membres de son corps, étant de sa chair et de ses os.</p><p><sup>31</sup> C'est pourquoi l'homme quittera son père et sa mère, et s'attachera à sa femme; et les deux ne seront qu'une seule chair.</p><p><sup>32</sup> Ce mystère est grand; je le dis par rapport à Christ et à l'Église.</p><p><sup>33</sup> Ainsi, que chacun de vous aime sa femme comme lui-même, et que la femme respecte son mari.</p>", "13": "<p><sup>1</sup> Enfants, obéissez à vos parents, selon le Seigneur; car cela est juste.</p><p><sup>2</sup> Honore ton père et ta mère; c'est le premier commandement qui ait une promesse.</p><p><sup>3</sup> Afin que tu sois heureux, et que tu vives longtemps sur la terre.</p><p><sup>4</sup> Et vous, pères, n'irritez point vos enfants, mais élevez-les dans la discipline des avertissements du Seigneur.</p><p><sup>5</sup> Esclaves, obéissez à vos maîtres selon la chair avec crainte et tremblement, dans la simplicité de votre cœur, comme à Christ;</p><p><sup>6</sup> Ne les servant pas seulement sous leurs yeux, comme si vous cherchiez à plaire aux hommes, mais comme des serviteurs de Christ faisant de bon cœur la volonté de Dieu;</p><p><sup>7</sup> Comme servant avec affection le Seigneur, et non pas les hommes;</p><p><sup>8</sup> Sachant que chacun, soit esclave, soit libre, recevra du Seigneur selon le bien qu'il aura fait.</p>", "14": "<p><sup>9</sup> Et vous, maîtres, agissez de même envers eux, et laissez les menaces, sachant que vous avez, comme eux, un Maître dans le ciel, et que, devant lui, il n'y a point d'acception de personnes.</p><p><sup>10</sup> Au reste, mes frères, fortifiez-vous dans le Seigneur, et dans la puissance de sa force.</p><p><sup>11</sup> Revêtez-vous de toute l'armure de Dieu, afin que vous puissiez tenir ferme contre les artifices de l’accusateur.</p><p><sup>12</sup> Car ce n'est pas contre la chair et le sang que nous avons à combattre, mais contre les autorités politiques et religieuses, contre les dirigeants pervers, contre les chefs de ce monde de ténèbres, contre les malices spirituelles dans les positions élevés.</p><p><sup>13</sup> C'est pourquoi prenez toutes les armes de Dieu, afin que vous puissiez résister dans les jours désastreux, et qu'ayant tout surmonté, vous demeuriez fermes.</p><p><sup>14</sup> Soyez donc fermes, vos reins ceints de la vérité, revêtus de la cuirasse de la justice,</p><p><sup>15</sup> Les pieds chaussés du zèle de l'Évangile de la paix;</p>", "15": "<p><sup>16</sup> Prenant, par-dessus tout, le bouclier de la foi, par le moyen duquel vous pourrez éteindre tous les traits enflammés du malin.</p><p><sup>17</sup> Prenez aussi le casque du salut, et l'ÉPÉE DE L’ESPRIT, qui est LA PAROLE DE DIEU;</p><p><sup>18</sup> Priant en tout temps par l'Esprit par toutes sortes de prières et de supplications; et veillant à cela en toute persévérance, et priant pour tous les Saints,</p><p><sup>19</sup> Et pour moi aussi, afin qu'il me soit donné de parler librement, avec hardiesse, pour faire connaître le mystère de l'Évangile,</p><p><sup>20</sup> Pour lequel je suis ambassadeur dans les chaînes, en sorte que j'en parle avec hardiesse, comme je dois en parler.</p><p><sup>21</sup> Or, afin que vous sachiez aussi ce qui me concerne, et ce que je fais, Tychique, le bien-aimé frère et fidèle ministre dans le Seigneur, vous informera de tout.</p><p><sup>22</sup> Je vous l'ai envoyé exprès, afin que vous connaissiez ce qui nous concerne, et qu'il console vos cœurs.</p><p><sup>23</sup> Que la paix, et la charité, avec la foi, soient données aux frères, de la part de Dieu le Père et Seigneur, Jésus-Christ!</p><p><sup>24</sup> Que la grâce soit avec tous ceux qui aiment notre Seigneur Jésus-Christ dans la sincérité! Amen.</p>", "26": "<p><b>Ps 4:2</b> Fils des hommes, jusqu'à quand ma gloire sera-t-elle mise en opprobre? Jusqu'à quand aimerez-vous la vanité, et rechercherez-vous le mensonge? (Sélah.)</p><p><b>Ps 5:3</b> Éternel, dès le matin tu entends ma voix; dès le matin je me tourne vers toi, et je regarde.</p><p><b>Ps 6:10</b> Tous mes ennemis seront confus et saisis d'effroi; ils reculeront, ils seront soudain couverts de honte.</p><p><b>Ps 17:1</b> Prière de David. Éternel! écoute ma juste cause; sois attentif à mon cri; prête l'oreille à la prière que je te fais, avec des lèvres sans fraude!</p>", "27": "<p><b>Ps 39:13</b> Détourne de moi ton regard, et que je reprenne mes forces, avant que je m'en aille et que je ne sois plus.</p><p><b>Ps 42:9</b> Je dirai à Dieu, mon rocher: Pourquoi m'as-tu oublié? Pourquoi marcherai-je en deuil, sous l'oppression de l'ennemi?</p><p><b>Ps 54:4</b> Voici, Dieu est mon aide, le Seigneur est avec ceux qui soutiennent mon âme.</p><p><b>Ps 55:2</b> Écoute-moi et réponds-moi; je m'agite dans ma plainte, et je gémis,</p>", "28": "<p><b>Ps 61:2</b> Du bout de la terre, je crie à toi, quand le cœur me manque; conduis-moi sur ce rocher, qui est plus élevé que moi.</p><p><b>Ps 65:3</b> Les iniquités avaient prévalu sur moi; mais toi, tu expieras nos transgressions.</p><p><b>Ps 66:19</b> Mais certainement Dieu m'a écouté; il a prêté l'oreille à la voix de ma prière.</p><p><b>Ps 66:20</b> Béni soit Dieu qui n'a point rejeté ma prière, ni retiré de moi sa gratuité!</p>", "29": "<p><b>Ps 69:14</b> Tire-moi du bourbier, et que je n'enfonce pas; que je sois délivré de mes ennemis et des eaux profondes!</p><p><b>Ps 84:9</b> O Dieu, notre bouclier, vois et regarde la face de ton Oint!</p><p><b>Ps 88:3</b> Car mon âme est rassasiée de maux, et ma vie touche au séjour des morts.</p>", "30": "<p><b>Ps 88:14</b> Éternel, pourquoi rejettes-tu mon âme, et me caches-tu ta face?</p><p><b>Ps 102:2</b> Ne me cache point ta face; au jour de ma détresse, incline vers moi ton oreille; au jour que je t'invoque, hâte-toi, réponds-moi!</p><p><b>Ps 102:18</b> Cela sera écrit pour la génération à venir; et le peuple qui sera créé, louera l'Éternel.</p><p><b>Ps 143:1</b> Psaume de David. Éternel, écoute ma requête, prête l'oreille à mes supplications; réponds-moi dans ta fidélité, dans ta justice!</p>"};const LBL={"1": "Éph. 1:1-14", "2": "Éph. 1:15-23", "3": "Éph. 2:1-10", "4": "Éph. 2:11-22", "5": "Éph. 3:1-10", "6": "Éph. 3:11-21", "7": "Éph. 4:1-10", "8": "Éph. 4:11-21", "9": "Éph. 4:22-32", "10": "Éph. 5:1-10", "11": "Éph. 5:11-21", "12": "Éph. 5:22-33", "13": "Éph. 6:1-8", "14": "Éph. 6:9-15", "15": "Éph. 6:16-24", "16": "Livre", "17": "Livre", "18": "Livre", "19": "Livre", "20": "Livre", "21": "Livre", "22": "Livre", "23": "Livre", "24": "Livre", "25": "Livre", "26": "Psaumes", "27": "Psaumes", "28": "Psaumes", "29": "Psaumes", "30": "Psaumes"};

let U=null,done={},notes={},cur=0,pg=0;
const ld=()=>{try{U=JSON.parse(localStorage.getItem('tw_u')||'null');done=JSON.parse(localStorage.getItem('tw_d')||'{}');notes=JSON.parse(localStorage.getItem('tw_n')||'{}')}catch(e){}};
