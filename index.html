const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bar(){const t=$('#top');t.hidden=!U;if(U)t.innerHTML=LOGO+`<span><b>${esc(U.p)} ${esc(U.n)}</b> · CM : ${esc(U.c)}</span>`;}
function show(h){app.innerHTML='<div class="screen">'+h+'</div>';bar();window.scrollTo(0,0)}
function login(){show(`<div class="hero">${LOGO}<h1 class="brand">LA VOIE<small>INTERNATIONALE</small></h1><p style="color:var(--mut)">Plan de lecture · Octobre</p></div>
<div class="card"><input id="p" placeholder="Prénom"><input id="n" placeholder="Nom"><input id="c" placeholder="Communion de maisonnée"><div class="row"><button id="go">Se connecter</button></div></div>`);
$('#go').onclick=()=>{const p=$('#p').value.trim(),n=$('#n').value.trim(),c=$('#c').value.trim();if(!p||!n||!c)return alert('Merci de remplir les trois champs.');U={p,n,c};sv();welcome()}}
function welcome(){show(`<div class="hero"><span style="font-size:54px">🕊️</span><h1>Bienvenue,<br>${esc(U.p)} ${esc(U.n)}</h1><p style="color:var(--gold);font-size:18px">Communion de maisonnée : ${esc(U.c)}</p></div><div class="row" style="justify-content:center"><button id="nx">Suivant</button></div>`);$('#nx').onclick=exhort}
function exhort(){show(`<h2>Une parole pour vous</h2><div class="card">Chaque jour, nos écrans captent des heures de notre attention. Aujourd'hui, choisissons de réorienter ce temps : quelques minutes devant la Parole valent plus que des heures de défilement. Elle nourrit l'âme, éclaire le chemin et fortifie la foi. Ouvrons nos cœurs, lisons, méditons et laissons Dieu nous parler.<br><br><b>Que Dieu vous bénisse !</b></div><div class="row" style="justify-content:center"><button id="nx">Passer au plan de lecture</button></div>`);$('#nx').onclick=plan}
const today=()=>{const d=new Date();return(d.getFullYear()>2026||d.getMonth()>9)?31:(d.getFullYear()<2026||d.getMonth()<9)?0:d.getDate()};
function plan(){const n=Object.keys(done).length;let g='';for(let i=1;i<=30;i++){const ok=i===1||!!done[i-1]||!!done[i];g+=`<div class="day ${done[i]?'done':''} ${ok?'':'lock'}" data-i="${i}">${done[i]?'✅':ok?'📖':'🔒'}<br><b>J${i}</b><small>${LBL[i]}</small></div>`}
show(`<h2>Plan de lecture · Octobre</h2><div class="bar"><i style="width:${n/30*100}%"></i></div><small style="color:var(--mut)">${n} jour(s) lu(s) sur 30</small><div class="grid" style="margin-top:14px">${g}</div>`);
document.querySelectorAll('.day:not(.lock)').forEach(e=>e.onclick=()=>openDay(+e.dataset.i))}
const note=i=>`<h3>Partage du cœur ✍️</h3><textarea id="nt" placeholder="Qu'est-ce que Dieu vous a dit aujourd'hui ?">${esc(notes[i]||'')}</textarea>`;
function saveNote(i){const t=$('#nt');if(t){notes[i]=t.value;sv()}}
function ill(c,i){let s='';for(let k=0;k<9;k++)s+=`<circle cx="${(k*83+i*37)%700}" cy="${20+(k*29)%70}" r="${2+k%3}" fill="#fff" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="${2+k%3}s" repeatCount="indefinite"/></circle>`;
return `<div class="ill"><svg viewBox="0 0 700 170" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b100d"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><rect width="700" height="170" fill="url(#g)"/>${s}<circle cx="${120+i*30}" cy="70" r="30" fill="${c}" opacity=".9"><animate attributeName="r" values="28;34;28" dur="4s" repeatCount="indefinite"/></circle><path d="M0 170 Q175 110 350 150 T700 130 V170Z" fill="#0b100d" opacity=".7"/><path d="M350 40v70M325 62h50" stroke="#fff" stroke-width="5" opacity=".6"/></svg></div>`}
function openDay(i){cur=i;pg=0;if(BOOK[i])bookDay(i);else ephDay(i)}
function ephDay(i){show(`<h2>Jour ${i}</h2><div class="card"><b>${REF[i]}</b></div>${ill(THEME[i%15],i)}<div class="card">${VERS[i]}</div>${note(i)}<div class="row"><button class="ghost" id="bk">← Retour</button><button id="fin">J'ai terminé la lecture ✓</button></div>`);$('#bk').onclick=()=>{saveNote(i);plan()};$('#fin').onclick=()=>finish(i)}
function bookDay(i){const b=BOOK[i];const draw=(cls)=>{show(`<h2>Jour ${i}</h2><small style="color:var(--mut)">« La Bible me le dit » · ${b.t}</small><div class="book"><div class="page ${cls||''}" id="pgc">${b.p[pg]}</div></div><div class="pn">Page ${b.n[pg]} · ${pg+1}/${b.p.length}</div><div class="row"><button class="ghost" id="pv" ${pg?'':'disabled'}>◀ Page précédente</button><button id="nxp">${pg<b.p.length-1?'Page suivante ▶':'Partage du cœur'}</button></div>`);
$('#pv').onclick=()=>flip(-1);$('#nxp').onclick=()=>pg<b.p.length-1?flip(1):end()};
const flip=d=>{$('#pgc').classList.add('out');setTimeout(()=>{pg+=d;draw('inn')},480)};
const end=()=>{show(`<h2>Jour ${i}</h2>${note(i)}<div class="row"><button class="ghost" id="bk">← Retour</button><button id="fin">J'ai terminé la lecture ✓</button></div>`);$('#bk').onclick=()=>{saveNote(i);plan()};$('#fin').onclick=()=>finish(i)};draw()}
function conf(e){for(let k=0;k<30;k++){const s=document.createElement('div');s.className='cf';s.textContent=e[k%e.length];s.style.left=Math.random()*100+'vw';s.style.animationDuration=2+Math.random()*2+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}}
function finish(i){saveNote(i);done[i]=1;sv();conf(['🎉','🎊','✨']);const all=Object.keys(done).length>=30;const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><div style="font-size:54px">🎉🎊</div><h2>Félicitations, ${esc(U.p)} !</h2><p>Jour ${i} accompli.<br>RDV demain pour la prochaine lecture.</p><button id="ok">Continuer</button></div>`;document.body.appendChild(m);$('#ok').onclick=()=>{m.remove();all?final():plan()}}
function final(){conf(['🙌','🎉','🕊️','✨']);show(`<div class="hero"><div style="font-size:56px"><span class="pp">🙌</span><span class="pp" style="animation-delay:.2s">🙏</span><span class="pp" style="animation-delay:.4s">🙌</span></div><h1>Gloire à Dieu !</h1></div><div class="card">Vous avez achevé le plan d'octobre. Ne vous arrêtez pas ici : faites de la lecture, de la méditation et de la prière un style de vie. Chaque jour, la Parole est une lampe à nos pieds.<br><br><b>Que Dieu vous bénisse !</b></div><div class="row" style="justify-content:center"><button id="bk">Revoir le plan</button></div>`);$('#bk').onclick=plan}
ld();U?(Object.keys(done).length?plan():welcome()):login();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script></body></html>
